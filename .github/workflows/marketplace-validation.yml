name: Marketplace and hassfest validation

on:
  push:
    branches: [dev, beta, main]
    paths:
      - "custom_components/**"
      - "hacs.json"
      - "README.md"
      - ".github/workflows/marketplace-validation.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS/Marketplace repository check
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS integration repository
        uses: hacs/action@main
        with:
          category: integration
          # Temporary for private beta validation: GitHub repo About metadata not yet set.
          # Remove 'description topics' after repository About is completed.
          ignore: brands description topics

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
