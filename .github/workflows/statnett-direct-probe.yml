name: Statnett direct-access probe

on:
  push:
    paths:
      - ".github/workflows/statnett-direct-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Inspect source HTTP response
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check direct Statnett HTTP responses
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from xml.etree import ElementTree

          urls = {
              "production": "https://driftsdata.statnett.no/restapi/ProductionConsumption/GetLatestDetailedOverview",
              "flows": "https://driftsdata.statnett.no/restapi/PhysicalFlowMap/GetFlow",
          }
          errors = 0
          print("UTC probe time:", datetime.now(timezone.utc).isoformat())
          for name, url in urls.items():
              print("\n---", name, "---")
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "HA-SwedishPower-Research/0.1",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=18) as response:
                      status = response.status
                      content_type = response.headers.get("Content-Type", "")
                      body = response.read(500000)
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  content_type = exc.headers.get("Content-Type", "")
                  body = exc.read(8000)
              except Exception as exc:
                  print("Network error:", type(exc).__name__, str(exc)[:250])
                  errors += 1
                  continue

              print("HTTP status:", status)
              print("Content-Type:", content_type)
              print("Body bytes read:", len(body))
              if status != 200:
                  errors += 1

              try:
                  payload = json.loads(body)
              except (ValueError, UnicodeDecodeError):
                  print("Body is not valid JSON")
                  try:
                      root = ElementTree.fromstring(body)
                      print("XML root:", root.tag)
                      print("XML first-level tags:", [x.tag for x in list(root)[:5]])
                  except Exception:
                      print("Non-JSON body sample (redacted):", repr(body[:120]))
                  errors += 1
                  continue

              print("JSON root type:", type(payload).__name__)
              if isinstance(payload, dict):
                  print("Root keys:", list(payload)[:30])
                  for key, value in payload.items():
                      if isinstance(value, list):
                          print(f"{key}: list length={len(value)}")
                          if value and isinstance(value[0], dict):
                              print(f"  first row keys: {list(value[0])[:18]}")
                              matches = [row for row in value if isinstance(row, dict) and (
                                  row.get("countryCode") == "SE" or
                                  "SE" in str(row.get("titleTranslationId", ""))
                              )]
                              for row in matches[:1]:
                                  print("  sample Sweden row:", json.dumps(row, ensure_ascii=False)[:400])
              elif isinstance(payload, list):
                  print("Rows:", len(payload))
                  if payload and isinstance(payload[0], dict):
                      print("First row keys:", list(payload[0])[:18])
                      matches = [row for row in payload if isinstance(row, dict) and (
                          str(row.get("InAreaElspotId", "")).startswith("SE") or
                          str(row.get("OutAreaElspotId", "")).startswith("SE")
                      )]
                      for row in matches[:2]:
                          print("Sample Swedish flow:", json.dumps(row, ensure_ascii=False)[:400])
          print("\nDirect JSON verification result:", "PASS" if not errors else f"INCOMPLETE ({errors} failed checks)")
          raise SystemExit(1 if errors else 0)
          PY
      - name: Check parser against actual Statnett responses
        uses: actions/checkout@v4

      - name: Run offline parser unit tests
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: Validate live production and Swedish flow parsing
        shell: bash
        run: |
          python tools/statnett_probe.py > /tmp/swedish-power-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path("/tmp/swedish-power-probe.json").read_text())
          prod = obj["production"]
          print("Country:", prod["scope"])
          print("Snapshot time:", prod["snapshot_reported_at"])
          print("Swedish production fields:")
          for k, rec in prod["values"].items():
              print(f"  {k}: {rec['value_mw']} MW; quality={rec['quality']}; measured_at={rec['measured_at']}")
          print("Accounting checks:", prod["checks"])
          print("Swedish flows:", len(obj["flows"]["flows"]))
          print("Internal SE1–SE4 flows:", sum(f["area_type"] == "internal" for f in obj["flows"]["flows"]))
          print("Cross-border Swedish flows:", sum(f["area_type"] == "cross_border" for f in obj["flows"]["flows"]))
          print("Direction:", obj["flows"]["sign_convention"])
          PY

      - name: Validate current HA backend model against direct live JSON
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import sys
          from types import ModuleType
          from urllib.request import Request, urlopen

          component = Path.cwd() / "custom_components" / "swedish_power"
          stub = ModuleType("swedish_power")
          stub.__path__ = [str(component)]
          sys.modules["swedish_power"] = stub
          from swedish_power.model import parse_production, parse_flows
          from swedish_power.const import SOURCE_URL, PRODUCTION_PATH, FLOWS_PATH

          def get(path):
              req = Request(SOURCE_URL + path, headers={
                  "Accept": "application/json",
                  "User-Agent": "HA-SwedishPower-Research/0.1",
              })
              with urlopen(req, timeout=20) as response:
                  assert response.status == 200, response.status
                  return json.load(response)

          # Live structure validation, not a Home Assistant runtime test.
          now = datetime.now(timezone.utc)
          snapshot = parse_production(get(PRODUCTION_PATH), now=now)
          flows = parse_flows(get(FLOWS_PATH), now=now)
          assert len(snapshot.readings) == 8
          assert snapshot.readings["production"].value_mw is not None
          assert snapshot.snapshot_at is not None
          print("Live backend model: PASS")
          print("Snapshot timestamp:", snapshot.snapshot_at.isoformat())
          print("Metrics:",
                {key: (val.value_mw, val.quality, val.timestamp_basis)
                 for key, val in snapshot.readings.items()})
          print("Accounting checks:", snapshot.checks)
          print("Sweden-related raw flow records:", len(flows))
          print("Internal Swedish flows:", sum(f.area_type == "internal" for f in flows))
          print("Flow directions: UNVERIFIED")
          PY
