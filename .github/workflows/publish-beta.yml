name: Validate and publish Swedish Power beta

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    name: Python syntax, source model and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          python -m compileall -q custom_components tests tools
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/swedish_power/manifest.json").read_text())
          repo = json.loads(Path("hacs.json").read_text())
          assert manifest["version"] == "2026.11.0b2"
          assert manifest["domain"] == "swedish_power"
          assert repo["homeassistant"] == "2026.11.0"
          assert repo["hide_default_branch"] is True
          print("Beta version and Marketplace metadata: PASS")
          PY

  homeassistant:
    name: HA 2026.11 integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "homeassistant==2026.11.0" "pytest-homeassistant==2026.11.0"
      - run: python -m pytest tests/ha_runtime -q --disable-warnings --maxfail=1

  hacs:
    name: Marketplace/HACS source check
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Temporary beta-only exceptions for GitHub About description/topics.
          # Issue #5 tracks removal once metadata is entered.
          ignore: brands description topics

  hassfest:
    name: Validate integration with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  prerelease:
    name: Publish prerelease from beta branch
    needs: [model, homeassistant, hacs, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish 2026.11.0b2 only after all gates pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c "import json; print(json.load(open('custom_components/swedish_power/manifest.json'))['version'])")"
          if [[ "$version" != "2026.11.0b2" ]]; then
            echo "Unexpected manifest version: $version"
            exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; do not overwrite an immutable test build."
            exit 0
          fi
          gh release create "$version" \
            --target "$GITHUB_SHA" \
            --title "Swedish Power $version — reactor data collection beta" \
            --notes-file RELEASE_NOTES_2026.11.0b2.md \
            --prerelease \
            --latest=false
          gh release view "$version" --json tagName,isPrerelease,url
