name: Home Assistant 2026.11 compatibility

on:
  push:
    branches: [dev, beta, main]
    paths:
      - "custom_components/**"
      - "tests/ha_runtime/**"
      - "tests/fixtures/**"
      - "pyproject.toml"
      - ".github/workflows/ha-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ha-runtime:
    name: Real HA setup, sensors and failure tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install matching Home Assistant test environment
        run: python -m pip install "homeassistant==2026.11.0" "pytest-homeassistant==2026.11.0"
      - name: Run HA integration lifecycle tests
        run: python -m pytest tests/ha_runtime -q --disable-warnings --maxfail=1
